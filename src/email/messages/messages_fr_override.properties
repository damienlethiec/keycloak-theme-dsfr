passwordResetSubject=HubEE - Réinitialisation du mot de passe
passwordResetBody=Quelqu''un vient de demander une réinitialisation de mot de passe pour votre compte {2}. Si vous êtes à l''origine de cette requête, veuillez cliquer sur le lien ci-dessous pour le mettre à jour.\n\n{0}\n\nCe lien expire dans {3}.\n\nSi vous n''êtes pas à l''origine de cette requête, veuillez ignorer ce message ; aucun changement ne sera effectué sur votre compte.\n\nCordialement, l''équipe {2}
passwordResetBodyHtml=<p>Quelqu''un vient de demander une réinitialisation de mot de passe pour votre compte {2}. Si vous êtes à l''origine de cette requête, veuillez cliquer sur le lien ci-dessous pour le mettre à jour.</p><p><a class="fr-btn" href="{0}">Réinitialiser le mot de passe</a></p><p>Si le bouton ne fonctionne pas correctement, vous pouvez copier-coller le lien suivant dans votre navigateur :</p><p>{0}</p><p>Ce lien expirera dans {3}.</p><p>Sinon, veuillez ignorer ce message ; aucun changement ne sera effectué sur votre compte.</p><p>Cordialement, l''équipe {2}</p>

